name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification_scope:
    name: Verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification_ok: ${{ steps.classify.outputs.classification_ok }}
      product: ${{ steps.classify.outputs.product }}
      browser: ${{ steps.classify.outputs.browser }}
      governance: ${{ steps.classify.outputs.governance }}
      workflow_contract: ${{ steps.classify.outputs.workflow_contract }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify verification inputs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/classify_verification_inputs.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" --github-output
          else
            python3 scripts/classify_verification_inputs.py --full --github-output
          fi

  product:
    name: Product quality (Node ${{ matrix.node-version }})
    needs: verification_scope
    if: needs.verification_scope.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        if: matrix.node-version == '24.x'
        run: npm run format:check

      - name: Lint
        if: matrix.node-version == '24.x'
        run: npm run lint

      - name: Type-check
        if: matrix.node-version == '24.x'
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit high and critical vulnerabilities
        if: matrix.node-version == '24.x'
        run: npm run audit:high

  dashboard_browser:
    name: Dashboard browser (Node 24.x)
    needs: verification_scope
    if: needs.verification_scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run dashboard browser E2E
        run: npm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-browser-failure-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  governance:
    name: Governance
    needs: verification_scope
    if: needs.verification_scope.outputs.governance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install governance dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-agent-harness.txt

      - name: Validate governance syntax
        run: |
          python -m py_compile \
            scripts/classify_verification_inputs.py \
            scripts/validate_governance.py \
            scripts/verify_task_skills.py

      - name: Validate governance contracts
        run: |
          python scripts/validate_governance.py
          python scripts/verify_task_skills.py
          python -m pytest -q \
            tests/governance/test_task_state.py \
            tests/governance/test_validate_governance.py

  workflow_contract:
    name: Workflow contract
    needs: verification_scope
    if: needs.verification_scope.outputs.workflow_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-agent-harness.txt

      - name: Verify workflow and classifier contracts
        run: |
          python -m py_compile scripts/classify_verification_inputs.py
          python -m pytest -q \
            tests/governance/test_verification_inputs.py \
            tests/governance/test_workflow_contract.py

  quality_gate:
    name: Quality gate (selected checks)
    if: always()
    needs:
      - verification_scope
      - product
      - dashboard_browser
      - governance
      - workflow_contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check
        env:
          SCOPE_RESULT: ${{ needs.verification_scope.result }}
          CLASSIFICATION_OK: ${{ needs.verification_scope.outputs.classification_ok }}
          PRODUCT_SELECTED: ${{ needs.verification_scope.outputs.product }}
          PRODUCT_RESULT: ${{ needs.product.result }}
          BROWSER_SELECTED: ${{ needs.verification_scope.outputs.browser }}
          BROWSER_RESULT: ${{ needs.dashboard_browser.result }}
          GOVERNANCE_SELECTED: ${{ needs.verification_scope.outputs.governance }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          WORKFLOW_SELECTED: ${{ needs.verification_scope.outputs.workflow_contract }}
          WORKFLOW_RESULT: ${{ needs.workflow_contract.result }}
        run: |
          require_selected() {
            selected="$1"
            result="$2"
            label="$3"
            if [ "$selected" = "true" ] && [ "$result" != "success" ]; then
              echo "$label was selected but finished as $result"
              return 1
            fi
            if [ "$selected" != "true" ] && [ "$result" != "skipped" ]; then
              echo "$label was not selected but finished as $result"
              return 1
            fi
          }

          [ "$SCOPE_RESULT" = "success" ]
          [ "$CLASSIFICATION_OK" = "true" ]
          require_selected "$PRODUCT_SELECTED" "$PRODUCT_RESULT" product
          require_selected "$BROWSER_SELECTED" "$BROWSER_RESULT" dashboard_browser
          require_selected "$GOVERNANCE_SELECTED" "$GOVERNANCE_RESULT" governance
          require_selected "$WORKFLOW_SELECTED" "$WORKFLOW_RESULT" workflow_contract
