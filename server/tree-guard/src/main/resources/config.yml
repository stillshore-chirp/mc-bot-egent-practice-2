# 実アカウント名はサーバー側だけに設定する。空の場合は全照会を拒否する。
bot-names: []
# 旧Bot helper用のイベント強制。既定では無効で、通常のプレイヤーと同じく
# Bukkit・サーバー・他pluginの権限／保護判定に従う。旧workflowを維持する場合だけ明示的に有効化する。
legacy-bot-action-guard:
  enabled: false
# 保護領域。worldはworld名、min/maxは包含端点。実座標をgitへ入れない。
protected-regions: []
# 汎用採掘を許可する領域。実座標をgitへ入れない。
natural-resource-regions: []
# 管理者が既存建築物の不存在と建築の許可を確認した拠点候補領域。
# 未設定なら拠点設営を拒否する。natural-resource-regions とは独立。
base-build-safe-regions: []
